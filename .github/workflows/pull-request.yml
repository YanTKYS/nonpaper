name: Pull request validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore NonPaper.sln

      - name: Build
        run: dotnet build NonPaper.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test NonPaper.sln --configuration Release --no-build
