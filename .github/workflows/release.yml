name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true
        type: string

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Extract release notes
        id: notes
        shell: python
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          import re, os, sys

          tag = os.environ["RELEASE_TAG"]
          with open("docs/release-notes.md", "r", encoding="utf-8") as f:
              content = f.read()

          # Accept both "1.10.0" and "v1.10.0" as input; release-notes uses "## v1.x.x" format
          search_variants = [tag, ("v" + tag) if not tag.startswith("v") else tag[1:]]
          m = None
          for search_tag in search_variants:
              pattern = r'^## (' + re.escape(search_tag) + r'[^\n]*)\n(.*?)(?=\n^## |\Z)'
              m = re.search(pattern, content, re.MULTILINE | re.DOTALL)
              if m:
                  break
          if not m:
              print(f"::error::Tag '{tag}' not found in docs/release-notes.md")
              sys.exit(1)

          title = m.group(1).strip()
          body = m.group(2).strip()

          with open("release_body.txt", "w", encoding="utf-8") as f:
              f.write(body)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"title={title}\n")

      # ── Current release: .NET 8 self-contained single-file ──────────────────

      - name: Publish self-contained single-file
        shell: pwsh
        run: |
          dotnet publish src/NonPaper/NonPaper.csproj `
            -c Release `
            -r win-x64 `
            --self-contained `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=none `
            -p:DebugSymbols=false `
            -o publish

      - name: Verify publish output
        shell: pwsh
        run: |
          # IIS配置に必須のファイルがdotnet publishの出力に含まれることを確認する。
          # 不足がある場合はZIPを作らずワークフローを失敗させる。
          $requiredFiles = @(
            "publish\NonPaper.exe",
            "publish\appsettings.json",
            "publish\web.config",
            "publish\wwwroot\index.html",
            "publish\wwwroot\manage.html",
            "publish\wwwroot\upload.html",
            "publish\wwwroot\meeting.html"
          )
          foreach ($path in $requiredFiles) {
            if (-not (Test-Path $path)) {
              throw "Required release file is missing: $path"
            }
          }
          if (-not (Get-ChildItem "publish\wwwroot\css" -Filter "*.css" -File -ErrorAction SilentlyContinue)) {
            throw "No CSS files found under publish\wwwroot\css"
          }
          if (-not (Get-ChildItem "publish\wwwroot\js" -Filter "*.js" -File -ErrorAction SilentlyContinue)) {
            throw "No JavaScript files found under publish\wwwroot\js"
          }

      - name: Configure IIS upload limit in web.config
        shell: pwsh
        run: |
          # dotnet publishが生成したweb.configへ、IIS側のリクエストサイズ上限
          # (requestLimits/maxAllowedContentLength) を追加する。既に設定済みの
          # 場合は変更しない。値はNonPaper側のMaxFileSizeBytes(既定100MiB)より
          # 大きい250MiBとし、docs/deployment-iis.mdの記載と一致させる。
          $webConfigPath = "publish\web.config"
          [xml]$xml = Get-Content -Path $webConfigPath

          $webServer = $xml.configuration.location.'system.webServer'
          if (-not $webServer) {
            throw "Unexpected web.config structure: system.webServer not found"
          }

          $security = $webServer.SelectSingleNode("security")
          if (-not $security) {
            $security = $xml.CreateElement("security")
            $webServer.AppendChild($security) | Out-Null
          }

          $requestFiltering = $security.SelectSingleNode("requestFiltering")
          if (-not $requestFiltering) {
            $requestFiltering = $xml.CreateElement("requestFiltering")
            $security.AppendChild($requestFiltering) | Out-Null
          }

          $requestLimits = $requestFiltering.SelectSingleNode("requestLimits")
          if (-not $requestLimits) {
            $requestLimits = $xml.CreateElement("requestLimits")
            $requestFiltering.AppendChild($requestLimits) | Out-Null
          }

          if (-not $requestLimits.maxAllowedContentLength) {
            $requestLimits.SetAttribute("maxAllowedContentLength", "262144000")
          }

          $xml.Save($webConfigPath)

      - name: Package as ZIP
        id: package
        shell: pwsh
        run: |
          $tag     = "${{ inputs.tag }}"
          $dirName = "nonpaper_$tag"
          $stageDir = Join-Path "stage" $dirName

          New-Item -ItemType Directory -Path $stageDir -Force | Out-Null
          New-Item -ItemType Directory -Path "artifacts"      -Force | Out-Null

          # publish配下を丸ごとコピーする（wwwrootなどのサブディレクトリも含める）。
          # appsettings.jsonやweb.configはIIS配置に必要なため除外しない。
          Copy-Item -Path "publish\*" -Destination $stageDir -Recurse -Force

          # 不要な.pdb/.xmlのみ除外する。
          Get-ChildItem -Path $stageDir -Recurse -File |
            Where-Object { $_.Extension -in @('.pdb', '.xml') } |
            Remove-Item -Force

          Copy-Item "README.md" -Destination $stageDir -Force

          $zipPath = Join-Path "artifacts" "$dirName.zip"
          Compress-Archive -Path $stageDir -DestinationPath $zipPath -Force

          "zip_path=$zipPath" | Out-File -Append $env:GITHUB_OUTPUT

      - name: Verify staged release contents
        shell: pwsh
        run: |
          $tag      = "${{ inputs.tag }}"
          $stageDir = Join-Path "stage" "nonpaper_$tag"

          $requiredFiles = @(
            "NonPaper.exe",
            "appsettings.json",
            "web.config",
            "README.md",
            "wwwroot\index.html",
            "wwwroot\manage.html",
            "wwwroot\upload.html",
            "wwwroot\meeting.html"
          )
          foreach ($relative in $requiredFiles) {
            $path = Join-Path $stageDir $relative
            if (-not (Test-Path $path)) {
              throw "Required file missing from staged release: $path"
            }
          }

      # ── Create GitHub Release ─────────────────────────────────────────────────

      - name: Create / overwrite GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag     = "${{ inputs.tag }}"
          $title   = "${{ steps.notes.outputs.title }}"
          $zipPath = "${{ steps.package.outputs.zip_path }}"

          # Delete existing release (ignore error if none exists)
          gh release delete $tag --yes 2>&1 | Out-Null
          $global:LASTEXITCODE = 0

          # Re-create or force-update the tag
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -fa $tag -m "Release $tag"
          git push -f origin "refs/tags/$tag"

          gh release create $tag $zipPath `
            --title $title `
            --notes-file release_body.txt
